name: build-and-deploy

on:
  workflow_dispatch:
  push:
    branches: [main, release, dev]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build-and-deploy.yml"

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/observatoryservices/observatory-services

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      overlay: ${{ steps.map.outputs.overlay }}
      tag: ${{ steps.map.outputs.tag }}
    steps:
      - id: map
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)     echo "overlay=dev" >> $GITHUB_OUTPUT ;;
            release) echo "overlay=release" >> $GITHUB_OUTPUT ;;
            main)    echo "overlay=prod" >> $GITHUB_OUTPUT ;;
          esac
          echo "tag=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
            build_args: APP_BIN=api
          - name: release-proxy
            context: backend
            dockerfile: backend/Dockerfile
            build_args: APP_BIN=release-proxy
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ needs.resolve.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.ref_name }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ github.ref_name }}

  bump-overlay:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Bump image tags in overlay
        working-directory: infra/k8s/overlays/${{ needs.resolve.outputs.overlay }}
        run: |
          kustomize edit set image \
            ${{ env.IMAGE_PREFIX }}-api=${{ env.IMAGE_PREFIX }}-api:${{ needs.resolve.outputs.tag }} \
            ${{ env.IMAGE_PREFIX }}-release-proxy=${{ env.IMAGE_PREFIX }}-release-proxy:${{ needs.resolve.outputs.tag }} \
            ${{ env.IMAGE_PREFIX }}-frontend=${{ env.IMAGE_PREFIX }}-frontend:${{ needs.resolve.outputs.tag }}

      - name: Commit and push
        run: |
          git config user.name  "observatory-ci[bot]"
          git config user.email "observatory-ci[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No overlay changes — nothing to commit."
            exit 0
          fi
          git add infra/k8s/overlays/${{ needs.resolve.outputs.overlay }}/kustomization.yaml
          git commit -m "ci(${{ needs.resolve.outputs.overlay }}): bump images to ${{ needs.resolve.outputs.tag }} [skip ci]"
          git push origin ${{ github.ref_name }}
