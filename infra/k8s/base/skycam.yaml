apiVersion: v1
kind: Service
metadata:
  name: skycam
spec:
  selector:
    app: skycam
  ports:
    - name: http
      port: 80
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skycam
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skycam
  template:
    metadata:
      labels:
        app: skycam
    spec:
      containers:
        - name: skycam
          image: ghcr.io/observatoryservices/observatory-services-skycam:latest
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: environment
            - name: MONGODB_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: mongodb_db
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: mongodb_uri
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: s3_endpoint
                  optional: true
            - name: S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: s3_public_endpoint
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: s3_bucket
                  optional: true
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: s3_region
                  optional: true
            # skycam-secrets is a Sealed Secret you create with kubeseal (keys:
            # ingest_token, s3_access_key, s3_secret_key). Marked optional so the
            # pod still starts before it exists — until then ingest returns
            # 503 (no token) / 500 (no S3).
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: skycam-secrets
                  key: ingest_token
                  optional: true
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: skycam-secrets
                  key: s3_access_key
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: skycam-secrets
                  key: s3_secret_key
                  optional: true
          readinessProbe:
            httpGet:
              path: /skycam/readyz
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /skycam/healthz
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
