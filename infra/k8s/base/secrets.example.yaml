# Reference only — do NOT commit real secrets.
# Apply these as plain Secrets, or convert to SealedSecrets / external-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-credentials
stringData:
  username: "REPLACE_ME"
  password: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
stringData:
  mongodb_uri: "mongodb://USER:PASS@mongodb:27017/observatory?authSource=admin"
---
apiVersion: v1
kind: Secret
metadata:
  name: release-proxy-secrets
stringData:
  s3_access_key: "REPLACE_ME"
  s3_secret_key: "REPLACE_ME"
  github_app_id: "REPLACE_ME"
  github_app_installation_id: "REPLACE_ME"
  github_app_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME
    -----END RSA PRIVATE KEY-----
---
# Used by components/skycam-v2 (Go ingest, Postgres, detect, notify).
apiVersion: v1
kind: Secret
metadata:
  name: skycam-v2-secrets
stringData:
  postgres_password: "REPLACE_ME"          # openssl rand -base64 24
  s3_access_key: "REPLACE_ME"              # a MinIO user scoped to this env's bucket
  s3_secret_key: "REPLACE_ME"
  operator_token: "REPLACE_ME"             # openssl rand -base64 32; control API service account
  # Optional:
  jwt_public_keys: ""                      # from `ingest keygen`: kid=<base64 PEM>. Public half ONLY.
  smtp_host: ""                            # e.g. email-smtp.us-east-1.amazonaws.com
  smtp_user: ""
  smtp_pass: ""
