apiVersion: v1
kind: Service
metadata:
  name: release-proxy
spec:
  selector:
    app: release-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-proxy
  template:
    metadata:
      labels:
        app: release-proxy
    spec:
      containers:
        - name: release-proxy
          image: ghcr.io/observatoryservices/observatory-services-release-proxy:latest
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: environment
            - name: MONGODB_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: mongodb_db
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: mongodb_uri
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: s3_endpoint
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: s3_bucket
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: s3_region
            - name: S3_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: s3_public_endpoint
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: release-proxy-secrets
                  key: s3_access_key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: release-proxy-secrets
                  key: s3_secret_key
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-credentials
                  key: app_id
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-credentials
                  key: client_id
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: github-app-credentials
                  key: installation_id
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app-credentials
                  key: private_key
            - name: PRODUCTS_CONFIG_PATH
              value: /config/products.yaml
          volumeMounts:
            - name: products
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /releases/healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: products
          configMap:
            name: products
