apiVersion: v1
kind: Service
metadata:
  name: release-proxy
spec:
  selector:
    app: release-proxy
  ports:
    - name: http
      port: 80
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: release-proxy
  template:
    metadata:
      labels:
        app: release-proxy
    spec:
      containers:
        - name: release-proxy
          image: ghcr.io/observatoryservices/observatory-services-release-proxy:latest
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: environment
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: s3_endpoint
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: s3_bucket
            # Phase 1c wires S3 + GitHub App secrets here:
            #   S3_ACCESS_KEY, S3_SECRET_KEY, GITHUB_APP_ID,
            #   GITHUB_APP_PRIVATE_KEY, GITHUB_APP_INSTALLATION_ID
            # all from secretKeyRef:name=release-proxy-secrets.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
