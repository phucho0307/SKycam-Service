apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observatory-prod

resources:
  - ../../base
  - mongodb-credentials.sealed.yaml
  - api-secrets.sealed.yaml

configMapGenerator:
  - name: app-config
    literals:
      - environment=prod
      - mongodb_db=observatory
      - s3_endpoint=<S3_ENDPOINT>
      - s3_bucket=observatory-prod

patches:
  - target:
      kind: Ingress
      name: observatory
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: observatory.services

images:
  - name: ghcr.io/observatoryservices/observatory-services-api
    newTag: prod
  - name: ghcr.io/observatoryservices/observatory-services-release-proxy
    newTag: prod
  - name: ghcr.io/observatoryservices/observatory-services-frontend
    newTag: prod
