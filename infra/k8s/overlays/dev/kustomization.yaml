apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observatory-dev

resources:
- ../../base
- mongodb-credentials.sealed.yaml
- api-secrets.sealed.yaml
- release-proxy-secrets.sealed.yaml
- github-app-credentials.sealed.yaml

configMapGenerator:
- literals:
  - environment=dev
  - mongodb_db=observatory_dev
  - s3_endpoint=http://minio.minio.svc.cluster.local:9000
  - s3_public_endpoint=https://s3.observatory.services
  - s3_bucket=observatory-dev
  - s3_region=us-east-1
  name: app-config

patches:
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: dev.observatory.services
  target:
    kind: Ingress
    name: observatory

images:
- name: ghcr.io/observatoryservices/observatory-services-api
  newName: ghcr.io/observatoryservices/observatory-services-api
  newTag: dev-c9aa4c3
- name: ghcr.io/observatoryservices/observatory-services-frontend
  newName: ghcr.io/observatoryservices/observatory-services-frontend
  newTag: dev-c9aa4c3
- name: ghcr.io/observatoryservices/observatory-services-release-proxy
  newName: ghcr.io/observatoryservices/observatory-services-release-proxy
  newTag: dev-c9aa4c3
