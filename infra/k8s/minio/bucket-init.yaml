# Creates buckets and per-env users on first start (idempotent on re-run).
# Buckets:
#   observatory-dev, observatory-release, observatory-prod
# Users (one per env, attached to a policy scoped to one bucket):
#   <env>-user
#
# Lifecycle (retention) rules, added 2026-10-01. Without them the 100Gi volume
# fills in under 3 days: one camera writes ~25MB of FITS a minute (~36GB/day).
# frames/ (raw FITS), previews/ and archive/ (compressed clear-sky FITS) expire. releases/ (public downloads) and any other
# prefix, e.g. a curated datasets/ for labelling, are never touched; verified
# against a real MinIO. Retention is set by the three *_DAYS env vars below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-bucket-init-script
  namespace: minio
data:
  init.sh: |
    #!/bin/sh
    set -eu

    until mc alias set local "http://minio:9000" "$ROOT_USER" "$ROOT_PASS" 2>/dev/null; do
      echo "waiting for minio..."
      sleep 2
    done

    for env in dev release prod; do
      bucket="observatory-${env}"
      ak_var="$(echo "${env}_AK" | tr a-z A-Z)"
      sk_var="$(echo "${env}_SK" | tr a-z A-Z)"
      ak="$(eval "echo \$${ak_var}")"
      sk="$(eval "echo \$${sk_var}")"

      mc mb --ignore-existing "local/${bucket}"

      # One rule per prefix. AbortIncompleteMultipartUpload is for AWS S3,
      # which otherwise keeps (and bills) abandoned upload parts forever. MinIO
      # accepts it but silently drops it; on MinIO the server setting
      # stale_uploads_expiry (set below) does that job instead.
      cat >/tmp/lifecycle-${env}.json <<JSON
    {
      "Rules": [
        {
          "ID": "frames",
          "Status": "Enabled",
          "Filter": { "Prefix": "frames/" },
          "Expiration": { "Days": ${FITS_EXPIRE_DAYS} },
          "AbortIncompleteMultipartUpload": { "DaysAfterInitiation": ${UPLOAD_RESUME_DAYS} }
        },
        {
          "ID": "previews",
          "Status": "Enabled",
          "Filter": { "Prefix": "previews/" },
          "Expiration": { "Days": ${PREVIEW_EXPIRE_DAYS} }
        },
        {
          "ID": "archive",
          "Status": "Enabled",
          "Filter": { "Prefix": "archive/" },
          "Expiration": { "Days": ${ARCHIVE_EXPIRE_DAYS} }
        }
      ]
    }
    JSON
      # import replaces the whole configuration, so re-running is idempotent.
      mc ilm import "local/${bucket}" < /tmp/lifecycle-${env}.json
      # Verify what was stored, not what was sent: MinIO has already been seen
      # accepting a lifecycle element and discarding it.
      stored="$(mc ilm export "local/${bucket}")"
      for rule in frames previews archive; do
        case "$stored" in
          *"\"ID\":\"${rule}\""*) ;;
          *) echo "lifecycle rule '${rule}' missing on ${bucket}: ${stored}" >&2; exit 1 ;;
        esac
      done

      cat >/tmp/policy-${env}.json <<JSON
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:*"],
          "Resource": [
            "arn:aws:s3:::${bucket}",
            "arn:aws:s3:::${bucket}/*"
          ]
        }
      ]
    }
    JSON
      mc admin policy create local "observatory-${env}-rw" /tmp/policy-${env}.json || true

      if ! mc admin user info local "${ak}" >/dev/null 2>&1; then
        mc admin user add local "${ak}" "${sk}"
      fi
      mc admin policy attach local "observatory-${env}-rw" --user "${ak}" || true

      # Public-read on objects published by the release-proxy so direct
      # download URLs work without presigning (binaries are public anyway).
      mc anonymous set download "local/${bucket}/releases" || true
    done

    # How long a camera may stay away and still resume a half-uploaded FITS,
    # MinIO's equivalent of AbortIncompleteMultipartUpload. Set explicitly so
    # it matches the AWS rule above rather than relying on MinIO's default.
    mc admin config set local api "stale_uploads_expiry=$((UPLOAD_RESUME_DAYS * 24))h"

    echo "bucket-init complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: minio
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-07-21T05-28-08Z
          command: ["/bin/sh", "/scripts/init.sh"]
          env:
            # Retention. Disk math (100Gi shared by all three envs, one camera):
            # FITS ~36GB/day, so 1 day of FITS is ~36GB; MinIO may take up to a
            # day more to process expiry, so budget ~2x. Previews are ~10KB
            # (fake Pi; the real Pi's 1024px JPEGs are larger, not yet measured),
            # 43,200 a day. Raise these only with a bigger volume.
            - name: FITS_EXPIRE_DAYS
              value: "1"
            - name: PREVIEW_EXPIRE_DAYS
              value: "7"
            # Compressed FITS of clear-sky frames only (written by the detect
            # worker; ~2.1x smaller than raw). Cloudy frames are never archived.
            # One camera: (clear fraction) x ~17 GB/day x this. Unknown clear
            # fraction, so sized for ~1/3 clear: 7 days is ~40 GB.
            - name: ARCHIVE_EXPIRE_DAYS
              value: "7"
            # A camera offline longer than this restarts its in-progress FITS.
            - name: UPLOAD_RESUME_DAYS
              value: "1"
            - name: ROOT_USER
              valueFrom:
                secretKeyRef: { name: minio-root, key: user }
            - name: ROOT_PASS
              valueFrom:
                secretKeyRef: { name: minio-root, key: password }
            - name: DEV_AK
              valueFrom:
                secretKeyRef: { name: minio-bucket-users, key: dev_access_key }
            - name: DEV_SK
              valueFrom:
                secretKeyRef: { name: minio-bucket-users, key: dev_secret_key }
            - name: RELEASE_AK
              valueFrom:
                secretKeyRef: { name: minio-bucket-users, key: release_access_key }
            - name: RELEASE_SK
              valueFrom:
                secretKeyRef: { name: minio-bucket-users, key: release_secret_key }
            - name: PROD_AK
              valueFrom:
                secretKeyRef: { name: minio-bucket-users, key: prod_access_key }
            - name: PROD_SK
              valueFrom:
                secretKeyRef: { name: minio-bucket-users, key: prod_secret_key }
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: minio-bucket-init-script
            defaultMode: 0755
