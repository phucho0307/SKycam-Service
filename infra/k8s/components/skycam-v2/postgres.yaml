# Postgres for the Go ingest service, detection and alerts.
#
# One instance, no replica: a single point of failure, stated in SCALING.md.
# Adequate for dev; before prod this becomes a managed database or an operator
# (CloudNativePG) with a streaming replica.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: skycam
            - name: POSTGRES_DB
              value: skycam
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skycam-v2-secrets
                  key: postgres_password
            # A subdirectory, because initdb refuses a mount point that holds
            # lost+found, which many volume provisioners create.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "skycam", "-d", "skycam"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
