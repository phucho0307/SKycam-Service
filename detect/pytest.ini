[pytest]
# test_detector.py predates these tests and is not one: it is a manual script that
# runs analyze() against whatever the latest real frame in Mongo happens to be, so
# it needs a live database and has no assertions. Run it with
# `python test_detector.py`. Collecting it would make `pytest` fail on a machine
# that has no pymongo, which is every machine running the Postgres backend.
addopts = --ignore=test_detector.py
testpaths = .
